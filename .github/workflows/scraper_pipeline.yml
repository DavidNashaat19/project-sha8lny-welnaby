# =============================================================================
#  .github/workflows/scraper_pipeline.yml
#  Project : Freelance Market Monitor (Sha8lny Welnaby)
#  Course  : CS313x Information Retrieval
# =============================================================================
#
#  WHAT THIS WORKFLOW DOES
#  -----------------------
#  1. Runs on a schedule (every 3 days at midnight UTC) OR on manual trigger.
#  2. Sets up Python 3.10 on ubuntu-latest.
#  3. Installs all required dependencies (Scraping, NLP, and EDA).
#  4. Runs the scraper   → produces freelance_data.json
#  5. Runs preprocessor  → produces data_before_cleaning.csv & data_after_cleaning.csv
#  6. Verifies eda_app.py builds correctly with the new data.
#  7. Commits & pushes all three output files back to the repository.
#     (This automatically updates the Streamlit EDA App if deployed on Streamlit Cloud!)
#
# =============================================================================

name: Scraper & IR Preprocessing Pipeline

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually? (optional)"
        required: false
        default: "Manual run"

permissions:
  contents: write

jobs:
  scrape-and-preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Set up Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          # Scraper & Preprocessor dependencies
          pip install requests beautifulsoup4 lxml pandas
          # EDA App dependencies (to ensure it compiles and is ready for deployment)
          pip install streamlit plotly scikit-learn

      - name: "🕷️  Run scraper (Deep Crawl)"
        run: |
          echo "▶ Starting scraper at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python scraper_ManeualSubmission.py
          echo "✅ Scraper finished. Checking output..."
          if [ ! -f freelance_data.json ]; then
            echo "❌ ERROR: freelance_data.json was not created by the scraper."
            exit 1
          fi
          echo "📄 freelance_data.json size: $(wc -c < freelance_data.json) bytes"

      - name: "🔬 Run IR preprocessing pipeline"
        run: |
          echo "▶ Starting preprocessor at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python preprocess.py
          echo "✅ Preprocessor finished. Checking outputs..."
          for f in data_before_cleaning.csv data_after_cleaning.csv; do
            if [ ! -f "$f" ]; then
              echo "❌ ERROR: $f was not produced by the preprocessor."
              exit 1
            fi
            echo "📄 $f → $(wc -l < $f) rows"
          done

      - name: "🧪 Verify EDA App (Syntax & Imports)"
        run: |
          echo "▶ Verifying eda_app.py compiles successfully..."
          python -m py_compile eda_app.py
          echo "✅ eda_app.py compiled successfully."

      - name: "💾 Commit and push data files"
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "freelance_data.json data_before_cleaning.csv data_after_cleaning.csv"
          commit_message: |
            chore(data): auto-update scraped & preprocessed data [${{ github.run_id }}]

            Triggered by: ${{ github.event_name }}
            Run at: ${{ github.run_id }} / ${{ github.sha }}
          commit_user_name:  "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author:     "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false

      - name: "📊 Write job summary"
        if: always()
        run: |
          echo "## 🕷️ Scraper Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size / Rows |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          for f in freelance_data.json data_before_cleaning.csv data_after_cleaning.csv; do
            if [ -f "$f" ]; then
              SIZE=$(wc -c < "$f")
              echo "| \`$f\` | ${SIZE} bytes |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| \`$f\` | ❌ Not produced |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow run:** [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
